name: "FUXA"
description: "Easy and Web-based Process Visualization (SCADA/HMI/Dashboard) software - now for Home Assistant"
url: "https://github.com/8OND007/FUXA-HA/"
documentation: "https://github.com/8OND007/FUXA-HA#readme"
#image: "frangoteam/fuxa"
version: "1.3.4"
slug: "fuxa"
webui: "http://[HOST]:[PORT:1881]/fuxa/home"
environment:
  LOG_LEVEL: "info"
options:
  BASE_PATH: "/fuxa"
schema:
  BASE_PATH: str
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
map:
  - type: addon_config   # /Share under HA Samba map "addon_configs"
    read_only: False
    path: /usr/src/app/FUXA/server/_appdata
  - type: share   # /Share under HA Samba map "share"
    read_only: False
    path: /usr/src/app/FUXA/server/_db
  - type: share   # /Share under HA Samba map "share"
    read_only: False
    path: /usr/src/app/FUXA/server/_pkg
  - type: share   # /Share under HA Samba map "share"
    read_only: False
    path: /usr/src/app/FUXA/server/_logs
  - type: media   # /Share under HA Samba map "media"
    read_only: False
    path: /usr/src/app/FUXA/server/_images
#  - type: media   # /Share under HA Samba map "media"
#    read_only: False
#    path: /usr/src/app/FUXA/server/_webcam_snapshots
  - type: media   # /Share under HA Samba map "media"
    read_only: False
    path: /usr/src/app/FUXA/client/assets/lib/svgeditor/shapes
#  - type: share   # /Share under HA Samba map "share"
#    read_only: False
#    path: /usr/src/app/FUXA/server/_reports
#  - type: share   # /Share under HA Samba map "share"
#    read_only: False
#    path: /usr/src/app/FUXA/server/_widgets
startup: services
ports:
  1881/tcp: 1881
